<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OS-AID Driver Guideline</title>
<meta name="description" content="Guideline for writing OS-AID pump, CGM and uploader drivers once in Rust, with thin AAPS and Trio wrappers.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sticky chapter rail on the left, one long reading column; rail collapses to a toggle on phones. */
:root {
  --bg: #f6f8f8;
  --surface: #ffffff;
  --fg: #16201f;
  --muted: #56646a;
  --line: #d9e1e2;
  --accent: #0b6b78;
  --accent-soft: #e2f0f1;
  --code-bg: #eef2f3;
  --cur-bg: #e3f2e6; --cur-fg: #1d6a33;
  --prop-bg: #fbefd9; --prop-fg: #8a5300;
  --kw: #8a2f52;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1516; --surface: #151d1f; --fg: #e3eaeb; --muted: #97a6aa; --line: #2a3639;
  --accent: #5cc3cf; --accent-soft: #173538; --code-bg: #1a2427;
  --cur-bg: #17331f; --cur-fg: #8fd6a2; --prop-bg: #3a2a10; --prop-fg: #f2c26b; --kw: #ee9bbb;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1516; --surface: #151d1f; --fg: #e3eaeb; --muted: #97a6aa; --line: #2a3639;
  --accent: #5cc3cf; --accent-soft: #173538; --code-bg: #1a2427;
  --cur-bg: #17331f; --cur-fg: #8fd6a2; --prop-bg: #3a2a10; --prop-fg: #f2c26b; --kw: #ee9bbb;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--bg); color: var(--fg);
  font: 16px/1.62 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.shell { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 48px; max-width: 1180px; margin: 0 auto; }

/* rail */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: 100vh; overflow-y: auto; padding-block: 32px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .02em; display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
.brand small { font-family: var(--font-mono); font-weight: 400; font-size: 11.5px; color: var(--muted); letter-spacing: 0; }
.toc-toggle { display: none; }
.toc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.toc a { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 5px 8px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 14px; line-height: 1.35; }
.toc a:hover { color: var(--fg); background: var(--accent-soft); }
.toc a.active { color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.nav-num { font-family: var(--font-mono); font-size: 12px; padding-top: 1px; color: inherit; opacity: .8; font-variant-numeric: tabular-nums; }

/* main */
main { min-width: 0; padding-block: 32px 96px; max-width: 820px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.meta span + span::before { content: "·"; margin-right: 16px; color: var(--line); }
.chapter { padding-block: 8px 40px; border-bottom: 1px solid var(--line); margin-bottom: 40px; }
.chapter:last-child { border-bottom: 0; }
.chapter[data-label]:not([data-label=""])::before {
  content: attr(data-label); display: block; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; position: relative; }
h1.ch-title { font-size: clamp(28px, 4.2vw, 38px); font-weight: 700; margin: 0 0 18px; letter-spacing: -.01em; }
#overview h1.ch-title { font-size: clamp(32px, 5vw, 46px); }
h2 { font-size: 23px; font-weight: 600; margin: 40px 0 12px; }
h3 { font-size: 18.5px; font-weight: 600; margin: 30px 0 10px; }
h4 { font-size: 16px; margin: 24px 0 8px; }
.anchor { position: absolute; left: -22px; padding-right: 6px; color: var(--line); text-decoration: none; font-weight: 400; opacity: 0; }
h2:hover .anchor, h3:hover .anchor, .anchor:focus { opacity: 1; color: var(--muted); }
p, ul, ol { margin: 0 0 14px; }
p, li { max-width: 68ch; }
ul, ol { padding-left: 22px; }
li { margin: 4px 0; }
li > ul, li > ol { margin: 4px 0; }
strong { font-weight: 600; }
hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }

code { font-family: var(--font-mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.code-wrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); }
pre { margin: 0; padding: 14px 16px; font-size: 13px; line-height: 1.5; }
pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; white-space: pre; }

.table-wrap { overflow-x: auto; margin: 4px 0 22px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.45; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th { font-family: var(--font-body); font-weight: 600; font-size: 12.5px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); background: var(--bg); white-space: nowrap; }
td:first-child { font-weight: 500; }
td code { white-space: normal; }

.pill { display: inline-block; font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; vertical-align: 1px; }
.pill-current { background: var(--cur-bg); color: var(--cur-fg); }
.pill-proposal { background: var(--prop-bg); color: var(--prop-fg); }
.kw { font-family: var(--font-mono); font-size: .8em; font-weight: 500; letter-spacing: .03em; color: var(--kw); }

ul:has(> li > .check) { list-style: none; padding-left: 0; }
li:has(> .check) { display: flex; gap: 10px; align-items: baseline; }
.check { accent-color: var(--accent); width: 16px; height: 16px; flex: none; transform: translateY(2px); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13.5px; color: var(--muted); padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 0 0 32px; }

@media (max-width: 880px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; max-height: none; overflow: visible; padding-block: 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .brand { flex-direction: row; align-items: baseline; justify-content: space-between; margin: 0; gap: 12px; }
  .toc-toggle { display: inline-flex; align-items: center; gap: 6px; font: 500 13px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .toc { display: none; max-height: 60vh; overflow-y: auto; padding-top: 10px; }
  .rail.open .toc { display: flex; }
  main { padding-top: 20px; }
  .anchor { display: none; }
  html { scroll-padding-top: 64px; }
}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Chapters">
    <div class="brand-row">
      <div class="brand">OS-AID Driver Guideline <small>draft · API v1</small></div>
      <button class="toc-toggle" id="toc-toggle" type="button" aria-expanded="false" aria-controls="toc">Chapters</button>
    </div>
    <ol class="toc" id="toc">
<!--NAV-->
    </ol>
  </nav>
  <main>
    <div class="meta"><span>u-osaid working group</span><span>Draft for review</span><span><!--DATE--></span></div>
    <div class="legend">
      <span><span class="pill pill-current">Current</span> what the repos already do</span>
      <span><span class="pill pill-proposal">Proposal</span> not yet agreed</span>
      <span><span class="kw">MUST</span> <span class="kw">SHOULD</span> <span class="kw">MAY</span> as in RFC 2119</span>
    </div>
<!--BODY-->
  </main>
</div>

<script>
(function () {
  var rail = document.getElementById('rail');
  var toggle = document.getElementById('toc-toggle');
  toggle.addEventListener('click', function () {
    var open = rail.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
  links.forEach(function (a) { a.addEventListener('click', function () { rail.classList.remove('open'); toggle.setAttribute('aria-expanded', 'false'); }); });
  var byId = {};
  links.forEach(function (a) { byId[a.dataset.target] = a; });
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          links.forEach(function (a) { a.classList.remove('active'); });
          var a = byId[e.target.id]; if (a) a.classList.add('active');
        }
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    document.querySelectorAll('.chapter').forEach(function (s) { io.observe(s); });
  }
  // Checklist ticks are remembered per viewer only.
  var KEY = 'osaid-checklist';
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { saved = {}; }
  document.querySelectorAll('input.check').forEach(function (box, i) {
    box.id = 'check-' + i;
    if (saved[i]) box.checked = true;
    box.addEventListener('change', function () {
      saved[i] = box.checked;
      try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
    });
  });
})();
</script>
</body>
</html>
